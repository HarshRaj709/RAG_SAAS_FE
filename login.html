<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — RAG SaaS</title><link rel="icon" href="assets/logo.svg">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; img-src 'self' data:;">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"></head>
<body><div class="auth-wrap">
<div class="auth-form-side"><div class="form-box">
  <a href="index.html" class="flex" style="font-weight:800;color:var(--text);text-decoration:none"><img src="assets/logo.svg" width="30" height="30" alt=""> RAG SaaS</a>
  <h2 class="mt2">Welcome back</h2><p class="muted small">Log in to manage your knowledge bases and bots.</p>
  <form id="f" class="mt2" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com"><div class="error"></div></div>
    <div class="field"><label for="pw">Password</label><div class="input-wrap"><input id="pw" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"><button type="button" class="toggle-pw" aria-label="Show password">👁</button></div><div class="error"></div></div>
    <div class="flex between"><label class="small"><input type="checkbox" id="remember"> Remember me</label><a href="signup.html" class="small">Need an account?</a></div>
    <button class="btn btn-primary mt2" style="width:100%" id="sub">Log in</button>
  </form></div></div>
<div class="auth-brand-side"><h2>Docs in. Answers out.</h2><ul><li>✅ <span>Upload PDFs & docs, watch live ingestion status</span></li><li>✅ <span>Launch bots with one-time secure API keys</span></li><li>✅ <span> grounded answers with citations & session memory</span></li></ul></div>
</div><script type="module" src="js/pages/login.js"></script></body></html>
